name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The marketing pages are static, so the only thing built here is the docs. It is built once and
  # the same files go to pre and then prod: what was looked at on pre.lpdf.io is what ships. The
  # docs carry the prod canonical address, like every other page, so nothing in them differs
  # between the two stages.
  build:
    name: Build the site
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      # The whole history, because the docs revision counts the commits of the day.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the committed bundles carry deploy sentinels
        run: ./.github/check-sentinels.sh

      # Astro 7 needs Node 22.12 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install the docs dependencies
        run: npm ci
        working-directory: docs-site

      # Renders every XML example in the docs with the engine copy in www/assets/js/lpdf-demo. An example
      # the engine rejects fails the build here, so a broken one is never deployed. It shows the engine
      # accepts the example, not that the example is right: an attribute the engine ignores still passes.
      - name: Check the docs examples render
        run: npm run check
        working-directory: docs-site

      # r<mmdd>.<n>: the commit's date and its place among that day's commits, so a re-run of the same
      # commit gives the same number. The docs header shows it, and the deploy jobs carry it in their names.
      # A run's own name cannot: it is fixed before any step has run.
      - name: Work out the docs revision
        id: revision
        run: |
          revision=$(node docs-site/scripts/build-info.mjs --revision)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Docs revision: $revision" >> "$GITHUB_STEP_SUMMARY"

      # Converts the markdown in www/docs/content and generates each example in Node.js with the
      # engine's code generator (www/assets/js/lpdf-demo), then builds the pages and the search index.
      - name: Build the docs
        run: npm run build
        working-directory: docs-site
        env:
          DOCS_REVISION: ${{ steps.revision.outputs.revision }}

      - name: Assemble the site
        run: bash ./.github/assemble-site.sh _site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          # .nojekyll starts with a dot, which upload-artifact leaves out unless asked.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy-pre:
    name: Deploy to pre (pages-pre) ${{ needs.build.outputs.revision }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-pre
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Set the pre URLs and CNAME
        run: bash ./.github/set-stage.sh _site pre

      - name: Push to pages-pre
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_PRE_TOKEN }}
          external_repository: lpdfio/pages-pre
          publish_branch: gh-pages
          publish_dir: _site/
          force_orphan: true

  deploy-prod:
    name: Deploy to prod (GitHub Pages) ${{ needs.build.outputs.revision }}
    needs: [build, deploy-pre]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Set the prod URLs
        run: bash ./.github/set-stage.sh _site prod

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - uses: actions/deploy-pages@v4
        id: deployment
